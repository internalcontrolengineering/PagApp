<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PagApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --negro: #1a1d21;
      --negro-suave: #2a2e35;
      --gris-oscuro: #3a3f47;
      --gris-medio: #6b7280;
      --gris-claro: #d1d5db;
      --gris-fondo: #e5e7eb;
      --gris-superficie: #f3f4f6;
      --blanco: #ffffff;
      --azul-acero: #4a5568;
      --azul-acero-claro: #718096;
      --verde-apagado: #38a169;
      --verde-apagado-oscuro: #2f855a;
      --rojo-apagado: #c53030;
      --rojo-oscuro: #9b2c2c;
      --amarillo: #d69e2e;
      --texto: #1a1d21;
      --texto-suave: #6b7280;
      --fondo-2: #eef0f3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { overflow-x: hidden; }

    body {
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #e5e7eb 0%, #f3f4f6 50%, #e5e7eb 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px;
      color: var(--texto);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    .app-wrapper {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: fadeInUp 0.4s ease-out;
    }

    /* ===== BRAND ===== */
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 6px 0 2px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: linear-gradient(145deg, var(--gris-oscuro), var(--negro));
      color: var(--blanco);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 900;
      box-shadow:
        0 6px 12px rgba(26, 29, 33, 0.25),
        inset 0 2px 4px rgba(255, 255, 255, 0.15),
        inset 0 -2px 4px rgba(0, 0, 0, 0.4);
    }

    .brand-name {
      font-size: clamp(1.3rem, 3vw, 1.6rem);
      font-weight: 900;
      letter-spacing: -0.6px;
      color: var(--negro);
    }

    .brand-name span { color: var(--verde-apagado); }

    /* ===== TABS ===== */
    .tabs-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      background: var(--blanco);
      border-radius: 18px;
      box-shadow:
        0 6px 16px rgba(26, 29, 33, 0.1),
        inset 0 2px 4px rgba(255, 255, 255, 1);
      overflow-x: auto;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    .tabs-bar::-webkit-scrollbar { height: 5px; }
    .tabs-bar::-webkit-scrollbar-thumb { background: var(--gris-claro); border-radius: 6px; }

    .tab {
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.8rem;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      white-space: nowrap;
      border: none;
      background: var(--fondo-2);
      color: var(--texto-suave);
      box-shadow:
        inset 0 2px 4px rgba(26, 29, 33, 0.08),
        inset 0 -1px 2px rgba(255, 255, 255, 0.8);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      min-height: 36px;
    }

    .tab:hover { color: var(--texto); transform: translateY(-1px); }

    .tab.activo {
      background: linear-gradient(145deg, var(--gris-oscuro), var(--negro));
      color: var(--blanco);
      box-shadow:
        0 4px 10px rgba(26, 29, 33, 0.3),
        inset 0 2px 4px rgba(255, 255, 255, 0.1),
        inset 0 -2px 4px rgba(0, 0, 0, 0.4);
    }

    .tab .tab-close {
      font-size: 0.7rem;
      opacity: 0.6;
      padding: 2px 4px;
      border-radius: 5px;
      transition: all 0.15s ease;
      line-height: 1;
    }

    .tab .tab-close:hover {
      background: rgba(197, 48, 48, 0.25);
      color: #ff6b6b;
      opacity: 1;
    }

    .tab.activo .tab-close:hover {
      background: rgba(255, 107, 107, 0.3);
      color: #ff8a8a;
    }

    .tab-rename-input {
      background: var(--blanco);
      border: 2px solid var(--gris-oscuro);
      border-radius: 8px;
      padding: 4px 8px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.8rem;
      color: var(--texto);
      outline: none;
      width: 140px;
      max-width: 100%;
    }

    /* ===== VISTA HOME ===== */
    .proyectos-home {
      background: var(--blanco);
      border-radius: 26px;
      width: 100%;
      box-shadow:
        0 20px 40px rgba(26, 29, 33, 0.15),
        0 6px 12px rgba(26, 29, 33, 0.08),
        inset 0 2px 4px rgba(255, 255, 255, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .home-header {
      background: linear-gradient(145deg, var(--gris-oscuro), var(--negro));
      padding: clamp(18px, 3vw, 24px) clamp(18px, 3.5vw, 26px) clamp(14px, 2.5vw, 20px);
      color: var(--blanco);
      position: relative;
      box-shadow:
        inset 0 4px 8px rgba(255, 255, 255, 0.08),
        inset 0 -4px 8px rgba(0, 0, 0, 0.3);
    }

    .home-header::after {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      border-radius: 2px;
    }

    .home-header h2 {
      font-size: clamp(1.2rem, 3vw, 1.4rem);
      font-weight: 900;
      letter-spacing: -0.4px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .home-header p {
      font-size: clamp(0.72rem, 1.6vw, 0.8rem);
      font-weight: 600;
      opacity: 0.65;
    }

    .home-body {
      padding: clamp(16px, 3vw, 22px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn-crear-proyecto {
      padding: 16px 20px;
      border: 2px dashed var(--gris-claro);
      border-radius: 16px;
      background: var(--fondo-2);
      color: var(--texto-suave);
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: clamp(0.85rem, 1.8vw, 0.95rem);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 52px;
    }

    .btn-crear-proyecto:hover {
      border-color: var(--gris-oscuro);
      color: var(--texto);
      background: var(--blanco);
      transform: translateY(-1px);
    }

    .proyectos-lista { display: flex; flex-direction: column; gap: 10px; }

    .proyecto-item {
      background: var(--blanco);
      border-radius: 18px;
      padding: 16px 18px;
      box-shadow:
        0 5px 12px rgba(26, 29, 33, 0.08),
        0 2px 4px rgba(26, 29, 33, 0.05),
        inset 0 1px 2px rgba(255, 255, 255, 1);
      border: 1px solid rgba(26, 29, 33, 0.06);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      animation: popIn 0.3s ease-out;
      min-height: 64px;
    }

    .proyecto-item:hover {
      transform: translateY(-2px);
      box-shadow:
        0 8px 16px rgba(26, 29, 33, 0.12),
        0 3px 6px rgba(26, 29, 33, 0.08);
    }

    .proyecto-item .proyecto-icono {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(145deg, var(--gris-oscuro), var(--negro));
      color: var(--blanco);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
      box-shadow:
        0 4px 8px rgba(26, 29, 33, 0.2),
        inset 0 2px 4px rgba(255, 255, 255, 0.1);
    }

    .proyecto-item .proyecto-info { flex: 1; min-width: 0; }

    .proyecto-item .proyecto-nombre {
      font-weight: 800;
      font-size: clamp(0.9rem, 1.9vw, 1rem);
      color: var(--texto);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .proyecto-item .proyecto-meta {
      font-size: clamp(0.68rem, 1.5vw, 0.78rem);
      font-weight: 600;
      color: var(--texto-suave);
    }

    .proyecto-item .proyecto-acciones { display: flex; gap: 4px; flex-shrink: 0; }

    .proyecto-item .btn-icono {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      color: var(--texto-suave);
      padding: 8px 10px;
      border-radius: 8px;
      transition: all 0.2s ease;
      font-family: inherit;
      line-height: 1;
      min-width: 36px;
      min-height: 36px;
    }

    .proyecto-item .btn-icono:hover {
      background: rgba(26, 29, 33, 0.06);
      color: var(--texto);
    }

    .proyecto-item .btn-icono.eliminar:hover {
      background: rgba(197, 48, 48, 0.12);
      color: var(--rojo-apagado);
    }

    .empty-proyectos {
      text-align: center;
      padding: 40px 20px;
      color: var(--texto-suave);
      font-weight: 600;
      font-size: clamp(0.8rem, 1.7vw, 0.9rem);
      line-height: 1.6;
    }

    .empty-proyectos .emoji {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    /* ===== VISTA DETALLE ===== */
    .container {
      background: var(--blanco);
      border-radius: 26px;
      width: 100%;
      box-shadow:
        0 20px 40px rgba(26, 29, 33, 0.15),
        0 6px 12px rgba(26, 29, 33, 0.08),
        inset 0 2px 4px rgba(255, 255, 255, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: fadeInUp 0.4s ease-out;
    }

    .header {
      background: linear-gradient(145deg, var(--gris-oscuro), var(--negro));
      padding: clamp(14px, 2.5vw, 20px) clamp(16px, 3vw, 22px);
      color: var(--blanco);
      position: relative;
      box-shadow:
        inset 0 4px 8px rgba(255, 255, 255, 0.08),
        inset 0 -4px 8px rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .header::after {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      border-radius: 2px;
    }

    .header-text { min-width: 0; flex: 1 1 200px; }

    .header-text h2 {
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      font-weight: 900;
      letter-spacing: -0.3px;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .header-text h2:hover { opacity: 0.85; }

    .header-text p {
      font-size: clamp(0.65rem, 1.5vw, 0.72rem);
      font-weight: 600;
      opacity: 0.6;
    }

    .body-content {
      padding: clamp(14px, 3vw, 20px);
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 2vw, 16px);
    }

    .input-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: stretch;
    }

    input[type="text"],
    input[type="number"],
    input[type="password"] {
      flex: 1 1 130px;
      padding: 13px 16px;
      border: none;
      border-radius: 14px;
      background: var(--fondo-2);
      color: var(--texto);
      font-size: 16px;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      box-shadow:
        inset 0 3px 6px rgba(26, 29, 33, 0.1),
        inset 0 -2px 4px rgba(255, 255, 255, 0.8);
      transition: all 0.25s ease;
      outline: none;
      min-height: 48px;
    }

    input::placeholder { color: var(--texto-suave); font-weight: 600; opacity: 0.8; }

    input:focus {
      background: var(--blanco);
      box-shadow:
        inset 0 3px 6px rgba(26, 29, 33, 0.08),
        inset 0 -2px 4px rgba(255, 255, 255, 0.9),
        0 0 0 3px rgba(74, 85, 104, 0.2);
    }

    button.primary {
      padding: 13px 18px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 800;
      font-size: clamp(0.8rem, 1.8vw, 0.88rem);
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(145deg, var(--gris-oscuro), var(--negro));
      color: var(--blanco);
      flex-shrink: 0;
      box-shadow:
        0 6px 12px rgba(26, 29, 33, 0.3),
        0 3px 6px rgba(26, 29, 33, 0.2),
        inset 0 2px 4px rgba(255, 255, 255, 0.1),
        inset 0 -3px 6px rgba(0, 0, 0, 0.4);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      position: relative;
      overflow: hidden;
      min-height: 48px;
    }

    button.primary::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 15%;
      right: 15%;
      height: 40%;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), transparent);
      border-radius: 14px 14px 50% 50%;
      pointer-events: none;
    }

    button.primary:hover {
      transform: translateY(-2px);
      box-shadow:
        0 9px 16px rgba(26, 29, 33, 0.35),
        0 5px 8px rgba(26, 29, 33, 0.25),
        inset 0 2px 4px rgba(255, 255, 255, 0.1),
        inset 0 -3px 6px rgba(0, 0, 0, 0.4);
    }

    button.primary:active {
      transform: translateY(2px) scale(0.98);
      box-shadow:
        0 2px 6px rgba(26, 29, 33, 0.3),
        inset 0 3px 8px rgba(0, 0, 0, 0.4);
    }

    .section-title {
      font-size: clamp(0.68rem, 1.6vw, 0.78rem);
      font-weight: 800;
      color: var(--texto-suave);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: -4px;
    }

    .lista-wrapper {
      max-height: min(420px, 50vh);
      overflow-y: auto;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .persona-card {
      background: var(--blanco);
      border-radius: 16px;
      padding: clamp(11px, 2vw, 14px);
      box-shadow:
        0 5px 10px rgba(26, 29, 33, 0.08),
        0 2px 4px rgba(26, 29, 33, 0.05),
        inset 0 1px 2px rgba(255, 255, 255, 1);
      border: 1px solid rgba(26, 29, 33, 0.06);
      display: flex;
      flex-direction: column;
      gap: 9px;
      transition: all 0.2s ease;
      animation: popIn 0.3s ease-out;
    }

    .persona-card:hover {
      box-shadow:
        0 7px 14px rgba(26, 29, 33, 0.12),
        0 2px 4px rgba(26, 29, 33, 0.08);
    }

    .persona-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .persona-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1 1 140px;
      min-width: 0;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 900;
      color: var(--blanco);
      flex-shrink: 0;
      box-shadow:
        0 4px 8px rgba(26, 29, 33, 0.2),
        inset 0 2px 4px rgba(255, 255, 255, 0.15);
    }

    .avatar.c0 { background: linear-gradient(145deg, var(--gris-oscuro), var(--negro)); }
    .avatar.c1 { background: linear-gradient(145deg, var(--azul-acero-claro), var(--azul-acero)); }
    .avatar.c2 { background: linear-gradient(145deg, var(--gris-medio), var(--gris-oscuro)); }
    .avatar.c3 { background: linear-gradient(145deg, #48bb78, var(--verde-apagado)); }
    .avatar.c4 { background: linear-gradient(145deg, #718096, #4a5568); }

    .persona-nombre {
      font-weight: 800;
      color: var(--texto);
      font-size: clamp(0.85rem, 1.9vw, 0.95rem);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .persona-subtotal {
      font-weight: 900;
      color: var(--negro);
      font-size: clamp(0.82rem, 1.8vw, 0.92rem);
      font-variant-numeric: tabular-nums;
      background: var(--fondo-2);
      padding: 4px 10px;
      border-radius: 10px;
      box-shadow: inset 0 2px 4px rgba(26, 29, 33, 0.08);
      white-space: nowrap;
    }

    .btn-eliminar {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      color: var(--texto-suave);
      padding: 6px 8px;
      border-radius: 7px;
      transition: all 0.2s ease;
      font-family: inherit;
      line-height: 1;
      min-width: 32px;
      min-height: 32px;
    }

    .btn-eliminar:hover {
      background: rgba(197, 48, 48, 0.1);
      color: var(--rojo-apagado);
    }

    .conceptos-lista { display: flex; flex-direction: column; gap: 5px; }

    .concepto-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: var(--fondo-2);
      border-radius: 9px;
      font-size: clamp(0.72rem, 1.6vw, 0.8rem);
      font-weight: 700;
      box-shadow: inset 0 2px 4px rgba(26, 29, 33, 0.06);
      gap: 6px;
      min-height: 36px;
      transition: background 0.15s ease;
    }

    .concepto-item:hover {
      background: #e8ebef;
    }

    .concepto-item .concepto-nombre {
      color: var(--texto);
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 5px;
      transition: background 0.15s ease;
      user-select: none;
    }

    .concepto-item .concepto-nombre:hover {
      background: rgba(26, 29, 33, 0.06);
    }

    .concepto-item .concepto-nombre::before {
      content: '•';
      color: var(--gris-medio);
      font-weight: 900;
    }

    .concepto-item .concepto-monto {
      color: var(--rojo-apagado);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 5px;
      transition: background 0.15s ease;
      user-select: none;
    }

    .concepto-item .concepto-monto:hover {
      background: rgba(197, 48, 48, 0.1);
    }

    .concepto-item .btn-quitar-concepto {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--texto-suave);
      font-size: 0.8rem;
      padding: 3px 6px;
      border-radius: 5px;
      transition: all 0.2s ease;
      font-family: inherit;
      margin-left: 3px;
      min-width: 28px;
      min-height: 28px;
    }

    .concepto-item .btn-quitar-concepto:hover {
      background: rgba(197, 48, 48, 0.15);
      color: var(--rojo-apagado);
    }

    /* Input inline para editar concepto o monto */
    .concepto-inline-input {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.8rem;
      border: 2px solid var(--azul-acero);
      border-radius: 6px;
      padding: 2px 6px;
      outline: none;
      background: var(--blanco);
      color: var(--texto);
      min-width: 70px;
      max-width: 140px;
    }

    .concepto-inline-input.monto {
      color: var(--rojo-apagado);
      text-align: right;
      max-width: 90px;
      min-width: 60px;
    }

    .concepto-inline-input:focus {
      border-color: var(--azul-acero);
      box-shadow: 0 0 0 3px rgba(74, 85, 104, 0.2);
    }

    .concepto-empty {
      font-size: clamp(0.68rem, 1.5vw, 0.75rem);
      font-weight: 600;
      color: var(--texto-suave);
      font-style: italic;
      padding: 3px 0;
      opacity: 0.7;
    }

    .concepto-input-row {
      display: flex;
      gap: 6px;
      align-items: stretch;
      flex-wrap: wrap;
    }

    .concepto-input-row input {
      flex: 1 1 90px;
      padding: 9px 11px;
      font-size: 16px;

  <script>
    const PASSWORD = 'ControlInterno2026';
    const STORAGE_KEY = 'pagapp_proyectos_v7';

    let proyectos = [];
    let proyectoActivoId = null;
    let proyectoAEliminar = null;
    let hayResultado = false;

    function guardar() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ proyectos })); }
      catch (e) { console.warn('No se pudo guardar', e); }
    }

    function cargar() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          proyectos = data.proyectos || [];
        }
      } catch (e) { proyectos = []; }
      proyectoActivoId = null;
    }

    function getProyectoActivo() { return proyectos.find(p => p.id === proyectoActivoId); }
    function generarId() { return 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }

    // ===== UTILIDAD: SOLO NÚMEROS EN MONTOS =====
    /**
     * Filtra la entrada para que solo contenga dígitos y un único punto decimal.
     * Limita a 2 decimales. Devuelve el string limpio.
     */
    function filtrarMonto(valor) {
      if (valor === null || valor === undefined) return '';
      let v = String(valor);

      // Eliminar todo lo que no sea dígito o punto
      v = v.replace(/[^0-9.]/g, '');

      // Solo un punto decimal
      const partes = v.split('.');
      if (partes.length > 2) {
        v = partes[0] + '.' + partes.slice(1).join('');
      }

      // Limitar a 2 decimales
      if (v.includes('.')) {
        const [ent, dec] = v.split('.');
        v = ent + '.' + dec.slice(0, 2);
      }

      return v;
    }

    /**
     * Aplica el filtro a un input en tiempo real.
     */
    function aplicarFiltroMontoInput(input) {
      input.addEventListener('input', () => {
        const cursorPos = input.selectionStart;
        const antes = input.value;
        const limpio = filtrarMonto(antes);
        if (limpio !== antes) {
          input.value = limpio;
          // Reposicionar cursor
          const diff = antes.length - limpio.length;
          const nuevaPos = Math.max(0, cursorPos - diff);
          try { input.setSelectionRange(nuevaPos, nuevaPos); } catch (e) {}
        }
      });
      input.addEventListener('keypress', (e) => {
        const char = String.fromCharCode(e.which);
        // Permitir solo dígitos y punto
        if (!/[0-9.]/.test(char)) {
          e.preventDefault();
          return;
        }
        // Permitir solo un punto
        if (char === '.' && input.value.includes('.')) {
          e.preventDefault();
        }
      });
      // Bloquear pegado de texto no numérico
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const texto = (e.clipboardData || window.clipboardData).getData('text');
        const limpio = filtrarMonto(texto);
        const start = input.selectionStart;
        const end = input.selectionEnd;
        const nuevo = input.value.slice(0, start) + limpio + input.value.slice(end);
        input.value = filtrarMonto(nuevo);
      });
    }

    // ===== ANIMACIONES =====
    const animLayer = document.getElementById('animLayer');

    function lanzarAnimacion(tipo) {
      const config = {
        persona:   { emojis: ['👤', '👥', '🧑', '👨', '👩'], count: 14, anim: 'fallDown',  duration: 1600 },
        concepto:  { emojis: ['💰', '💵', '🪙', '💸'],        count: 12, anim: 'riseUp',    duration: 1500 },
        proyecto:  { emojis: ['📁', '✨', '📂'],              count: 10, anim: 'riseUp',    duration: 1500 },
        eliminar:  { emojis: ['🗑️', '❌', '💥'],              count: 12, anim: 'explodeOut', duration: 1100 },
        exito:     { emojis: ['✅', '🎉', '✨'],              count: 14, anim: 'burstCenter', duration: 1200 },
        error:     { emojis: ['⚠️', '❌', '🚫'],              count: 10, anim: 'explodeOut', duration: 1000 },
        candado:   { emojis: ['🔓', '🔑', '✨'],              count: 10, anim: 'burstCenter', duration: 1200 },
        candadoErr:{ emojis: ['🔒', '⛔', '❌'],              count: 10, anim: 'explodeOut', duration: 1000 },
        calcular:  { emojis: ['🧮', '📊', '💡', '✨'],        count: 12, anim: 'burstCenter', duration: 1300 },
        resetear:  { emojis: ['↺', '🔄', '✨'],              count: 10, anim: 'spinAround', duration: 1200 },
        whatsapp:  { emojis: ['✈️', '📤', '📨'],              count: 10, anim: 'flyAway',   duration: 1600 },
        editar:    { emojis: ['✏️', '📝', '✨'],              count: 10, anim: 'burstCenter', duration: 1000 },
      };

      const c = config[tipo] || config.exito;
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;

      for (let i = 0; i < c.count; i++) {
        const el = document.createElement('div');
        el.className = 'anim-particle';
        el.textContent = c.emojis[Math.floor(Math.random() * c.emojis.length)];
        el.style.fontSize = (1.4 + Math.random() * 1.4) + 'rem';
        el.style.left = cx + 'px';
        el.style.top = cy + 'px';
        el.style.animation = `${c.anim} ${c.duration}ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards`;
        el.style.animationDelay = (i * 40) + 'ms';

        const angle = (Math.PI * 2 * i) / c.count + Math.random() * 0.5;
        const dist = 120 + Math.random() * 220;
        el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        el.style.setProperty('--dy', Math.sin(angle) * dist + 'px');

        if (c.anim === 'fallDown') {
          el.style.left = (Math.random() * window.innerWidth) + 'px';
          el.style.top = '-60px';
        }
        if (c.anim === 'riseUp') {
          el.style.left = (Math.random() * window.innerWidth) + 'px';
          el.style.top = (window.innerHeight - 60) + 'px';
        }
        if (c.anim === 'flyAway') {
          el.style.left = (cx - 40 + Math.random() * 80) + 'px';
          el.style.top = (cy - 40 + Math.random() * 80) + 'px';
        }

        animLayer.appendChild(el);
        setTimeout(() => el.remove(), c.duration + 400 + i * 40);
      }
    }

    // ===== MODALES =====
    const modalOverlay = document.getElementById('modalOverlay');
    const modalIcon = document.getElementById('modalIcon');
    const modalTitulo = document.getElementById('modalTitulo');
    const modalMensaje = document.getElementById('modalMensaje');
    const modalInput = document.getElementById('modalInput');
    const modalError = document.getElementById('modalError');
    const modalBotones = document.getElementById('modalBotones');

    let modalResolve = null;

    function mostrarModal(opts) {
      return new Promise((resolve) => {
        modalResolve = resolve;

        const iconMap = { info: 'ℹ️', success: '✅', danger: '🗑️', warning: '⚠️' };
        modalIcon.className = 'modal-icon ' + (opts.iconoTipo || 'info');
        modalIcon.textContent = opts.icono || iconMap[opts.iconoTipo] || 'ℹ️';

        modalTitulo.textContent = opts.titulo || '';
        modalMensaje.innerHTML = opts.mensaje || '';
        modalMensaje.style.display = opts.mensaje ? 'block' : 'none';

        if (opts.input) {
          modalInput.classList.remove('hidden');
          modalInput.type = opts.inputType || 'text';
          modalInput.placeholder = opts.placeholder || '';
          modalInput.value = opts.valorInput || '';
          if (opts.inputType === 'number') {
            // aplicar filtro al input del modal
            if (!modalInput.dataset.filtroAplicado) {
              aplicarFiltroMontoInput(modalInput);
              modalInput.dataset.filtroAplicado = '1';
            }
          }
        } else {
          modalInput.classList.add('hidden');
        }

        modalError.classList.remove('visible');
        modalError.textContent = '';

        modalBotones.innerHTML = '';
        const botones = opts.botones || [{ texto: 'OK', tipo: 'confirmar', valor: true }];
        botones.forEach(b => {
          const btn = document.createElement('button');
          btn.className = b.tipo === 'cancelar' ? 'btn-cancelar' : 'btn-confirmar ' + (b.estilo || '');
          btn.textContent = b.texto;
          btn.addEventListener('click', () => {
            const valor = b.valor;
            const inputVal = opts.input ? modalInput.value : null;
            cerrarModalInterno();
            if (modalResolve) {
              modalResolve({ confirmado: valor, input: inputVal });
              modalResolve = null;
            }
          });
          modalBotones.appendChild(btn);
        });

        modalOverlay.classList.add('activo');

        if (opts.input) {
          setTimeout(() => { modalInput.focus(); modalInput.select(); }, 150);
        }
      });
    }

    function cerrarModalInterno() {
      modalOverlay.classList.remove('activo');
      modalInput.value = '';
      modalError.classList.remove('visible');
    }

    function cerrarModalConCancelar() {
      if (modalResolve) {
        modalResolve({ confirmado: false, input: null });
        modalResolve = null;
      }
      cerrarModalInterno();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalOverlay.classList.contains('activo')) {
        cerrarModalConCancelar();
      }
    });
    modalOverlay.addEventListener('click', (e) => {
      if (e.target.id === 'modalOverlay') cerrarModalConCancelar();
    });

    function modalAlerta(titulo, mensaje, tipo) {
      return mostrarModal({
        iconoTipo: tipo || 'info',
        titulo,
        mensaje,
        botones: [{ texto: 'Entendido', tipo: 'confirmar', valor: true }]
      });
    }

    function modalConfirmar(titulo, mensaje, textoConfirmar, estilo) {
      return mostrarModal({
        iconoTipo: 'danger',
        icono: '⚠️',
        titulo,
        mensaje,
        botones: [
          { texto: 'Cancelar', tipo: 'cancelar', valor: false },
          { texto: textoConfirmar || 'Confirmar', tipo: 'confirmar', valor: true, estilo: estilo || 'peligro' }
        ]
      });
    }

    function modalPrompt(titulo, mensaje, valorInicial, placeholder) {
      return mostrarModal({
        iconoTipo: 'info',
        icono: '✏️',
        titulo,
        mensaje,
        input: true,
        valorInput: valorInicial || '',
        placeholder: placeholder || '',
        botones: [
          { texto: 'Cancelar', tipo: 'cancelar', valor: false },
          { texto: 'Aceptar', tipo: 'confirmar', valor: true }
        ]
      });
    }

    // ===== LÓGICA =====
    function actualizarBotonAccion() {
      const btn = document.getElementById('btnAccion');
      if (!btn) return;
      if (hayResultado) {
        btn.classList.remove('calcular');
        btn.classList.add('resetear');
        btn.textContent = '↺ Resetear';
      } else {
        btn.classList.remove('resetear');
        btn.classList.add('calcular');
        btn.textContent = 'Calcular ajustes';
      }
    }

    function accionPrincipal() {
      if (hayResultado) {
        resetearResultado();
        lanzarAnimacion('resetear');
      } else {
        calcular();
      }
    }

    function resetearResultado() {
      document.getElementById('resultado').innerHTML = '';
      hayResultado = false;
      actualizarBotonAccion();
    }

    function invalidarResultado() {
      if (hayResultado) {
        document.getElementById('resultado').innerHTML = '';
        hayResultado = false;
        actualizarBotonAccion();
      }
    }

    function irAHome() {
      proyectoActivoId = null;
      hayResultado = false;
      renderizarTabs();
      renderizarVista();
    }

    function abrirProyecto(id) {
      proyectoActivoId = id;
      hayResultado = false;
      renderizarTabs();
      renderizarVista();
      document.getElementById('resultado').innerHTML = '';
      actualizarBotonAccion();
    }

    function renderizarTabs() {
      const bar = document.getElementById('tabsBar');
      bar.innerHTML = '';

      const tabHome = document.createElement('button');
      tabHome.className = 'tab' + (proyectoActivoId === null ? ' activo' : '');
      tabHome.innerHTML = '🏠 Proyectos';
      tabHome.addEventListener('click', irAHome);
      bar.appendChild(tabHome);

      if (proyectoActivoId !== null) {
        const p = getProyectoActivo();
        if (p) {
          const tab = document.createElement('button');
          tab.className = 'tab activo';
          tab.innerHTML = `<span class="tab-nombre">📁 ${p.nombre}</span><span class="tab-close" title="Eliminar proyecto">✕</span>`;

          const nombreSpan = tab.querySelector('.tab-nombre');
          nombreSpan.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            editarNombreProyecto(p.id, nombreSpan);
          });
          let lastTap = 0;
          nombreSpan.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTap < 300) {
              e.preventDefault();
              editarNombreProyecto(p.id, nombreSpan);
            }
            lastTap = now;
          });

          tab.addEventListener('click', (e) => {
            if (e.target.classList.contains('tab-close')) {
              e.stopPropagation();
              abrirModalEliminar(p.id);
            }
          });

          bar.appendChild(tab);
        }
      }
    }

    function editarNombreProyecto(id, spanElement) {
      const p = proyectos.find(x => x.id === id);
      if (!p) return;

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'tab-rename-input';
      input.value = p.nombre;

      const terminar = (guardarCambio) => {
        if (guardarCambio) {
          const nuevoNombre = input.value.trim();
          if (nuevoNombre && nuevoNombre !== p.nombre) {
            p.nombre = nuevoNombre;
            guardar();
            renderizarTabs();
            if (proyectoActivoId === id) renderizarHeader();
          } else {
            renderizarTabs();
          }
        } else {
          renderizarTabs();
        }
      };

      input.addEventListener('blur', () => terminar(true));
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); terminar(true); }
        if (e.key === 'Escape') { e.preventDefault(); terminar(false); }
      });

      spanElement.replaceWith(input);
      input.focus();
      input.select();
    }

    function renderizarVista() {
      const home = document.getElementById('vistaHome');
      const detalle = document.getElementById('vistaDetalle');

      if (proyectoActivoId === null) {
        home.classList.remove('hidden');
        detalle.classList.add('hidden');
        renderizarHome();
      } else {
        home.classList.add('hidden');
        detalle.classList.remove('hidden');
        renderizarHeader();
        renderizar();
      }
    }

    function renderizarHome() {
      const lista = document.getElementById('proyectosLista');
      lista.innerHTML = '';

      if (proyectos.length === 0) {
        lista.innerHTML = `
          <div class="empty-proyectos">
            <span class="emoji">📂</span>
            No hay proyectos todavía.<br>
            Crea uno para comenzar.
          </div>
        `;
        return;
      }

      proyectos.forEach(p => {
        const item = document.createElement('div');
        item.className = 'proyecto-item';

        const totalPersonas = p.personas.length;
        const totalConceptos = p.personas.reduce((acc, x) => acc + x.conceptos.length, 0);
        const totalMonto = p.personas.reduce((acc, x) =>
          acc + x.conceptos.reduce((s, c) => s + c.monto, 0), 0);

        item.innerHTML = `
          <div class="proyecto-icono">📁</div>
          <div class="proyecto-info">
            <div class="proyecto-nombre" title="Doble clic para renombrar">${p.nombre}</div>
            <div class="proyecto-meta">${totalPersonas} persona${totalPersonas !== 1 ? 's' : ''} · ${totalConceptos} concepto${totalConceptos !== 1 ? 's' : ''} · $${totalMonto.toFixed(2)}</div>
          </div>
          <div class="proyecto-acciones">
            <button class="btn-icono eliminar" title="Eliminar proyecto">🗑️</button>
          </div>
        `;

        item.addEventListener('click', (e) => {
          if (e.target.closest('.btn-icono')) return;
          abrirProyecto(p.id);
        });

        const nombreDiv = item.querySelector('.proyecto-nombre');
        nombreDiv.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          editarNombreEnLista(p.id, nombreDiv);
        });

        let lastTap = 0;
        nombreDiv.addEventListener('touchend', (e) => {
          const now = Date.now();
          if (now - lastTap < 300) {
            e.preventDefault();
            e.stopPropagation();
            editarNombreEnLista(p.id, nombreDiv);
          }
          lastTap = now;
        });

        item.querySelector('.btn-icono.eliminar').addEventListener('click', (e) => {
          e.stopPropagation();
          abrirModalEliminar(p.id);
        });

        lista.appendChild(item);
      });
    }

    function editarNombreEnLista(id, nombreDiv) {
      const p = proyectos.find(x => x.id === id);
      if (!p) return;

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'tab-rename-input';
      input.style.width = '100%';
      input.value = p.nombre;

      const terminar = (guardarCambio) => {
        if (guardarCambio) {
          const nuevoNombre = input.value.trim();
          if (nuevoNombre && nuevoNombre !== p.nombre) {
            p.nombre = nuevoNombre;
            guardar();
            if (proyectoActivoId === id) renderizarHeader();
          }
        }
        renderizarHome();
      };

      input.addEventListener('blur', () => terminar(true));
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); terminar(true); }
        if (e.key === 'Escape') { e.preventDefault(); terminar(false); }
      });

      nombreDiv.replaceWith(input);
      input.focus();
      input.select();
    }

    function renderizarHeader() {
      const p = getProyectoActivo();
      document.getElementById('proyectoTitulo').textContent = p ? p.nombre : 'PagApp';
    }

    async function abrirModalNuevoProyecto() {
      const res = await modalPrompt(
        'Nuevo proyecto',
        'Escribe un nombre para el proyecto:',
        `Proyecto ${proyectos.length + 1}`,
        'Nombre del proyecto'
      );
      if (!res.confirmado) return;
      const nombreLimpio = (res.input || '').trim();
      if (!nombreLimpio) {
        await modalAlerta('Nombre vacío', 'El nombre no puede estar vacío.', 'warning');
        lanzarAnimacion('error');
        return;
      }

      const nuevo = { id: generarId(), nombre: nombreLimpio, personas: [] };
      proyectos.push(nuevo);
      guardar();
      abrirProyecto(nuevo.id);
      lanzarAnimacion('proyecto');
    }

    function abrirModalEliminar(id) {
      const p = proyectos.find(x => x.id === id);
      if (!p) return;
      proyectoAEliminar = id;

      mostrarModal({
        iconoTipo: 'danger',
        icono: '🔒',
        titulo: 'Confirmar eliminación',
        mensaje: `Para eliminar el proyecto <b>${p.nombre}</b> y todos sus datos, ingresa la contraseña de administrador.`,
        input: true,
        inputType: 'password',
        placeholder: 'Contraseña',
        botones: [
          { texto: 'Cancelar', tipo: 'cancelar', valor: false },
          { texto: 'Eliminar', tipo: 'confirmar', valor: true, estilo: 'peligro' }
        ]
      }).then((res) => {
        if (!res.confirmado) return;
        if (res.input !== PASSWORD) {
          lanzarAnimacion('candadoErr');
          modalAlerta('Contraseña incorrecta', 'La contraseña ingresada no es válida. No se eliminó el proyecto.', 'danger');
          return;
        }
        lanzarAnimacion('candado');
        setTimeout(() => ejecutarEliminarProyecto(), 400);
      });
    }

    function solicitarEliminarProyecto() {
      if (!proyectoActivoId) return;
      abrirModalEliminar(proyectoActivoId);
    }

    function ejecutarEliminarProyecto() {
      const idx = proyectos.findIndex(p => p.id === proyectoAEliminar);
      if (idx === -1) return;

      proyectos.splice(idx, 1);
      if (proyectoActivoId === proyectoAEliminar) proyectoActivoId = null;
      proyectoAEliminar = null;
      guardar();
      hayResultado = false;
      renderizarTabs();
      renderizarVista();
      lanzarAnimacion('eliminar');
    }

    async function intentarAgregarPersona() {
      const p = getProyectoActivo();
      if (!p) return;

      const nombreInput = document.getElementById('nombre');
      const nombre = nombreInput.value.trim();

      if (!nombre) {
        await modalAlerta('Campo vacío', 'Ingresa un nombre válido para la persona.', 'warning');
        lanzarAnimacion('error');
        return;
      }

      p.personas.push({ nombre, conceptos: [] });
      nombreInput.value = '';
      nombreInput.focus();
      guardar();
      invalidarResultado();
      renderizar();
      lanzarAnimacion('persona');
    }

    async function eliminarPersona(index) {
      const p = getProyectoActivo();
      if (!p) return;

      const res = await modalConfirmar(
        'Eliminar persona',
        `¿Eliminar a <b>${p.personas[index].nombre}</b> y todos sus conceptos?`,
        'Eliminar',
        'peligro'
      );
      if (!res.confirmado) return;

      p.personas.splice(index, 1);
      guardar();
      invalidarResultado();
      renderizar();
      lanzarAnimacion('eliminar');
    }

    async function agregarConcepto(personaIndex, nombreConcepto, montoConcepto) {
      const p = getProyectoActivo();
      if (!p) return false;

      const nombre = nombreConcepto.trim();
      const monto = parseFloat(montoConcepto);

      if (!nombre || isNaN(monto) || monto <= 0) {
        await modalAlerta('Datos inválidos', 'Ingresa un concepto y un monto válido (mayor a 0).', 'warning');
        lanzarAnimacion('error');
        return false;
      }

      p.personas[personaIndex].conceptos.push({ nombre, monto });
      guardar();
      invalidarResultado();
      renderizar();
      lanzarAnimacion('concepto');
      return true;
    }

    async function quitarConcepto(personaIndex, conceptoIndex) {
      const p = getProyectoActivo();
      if (!p) return;

      const concepto = p.personas[personaIndex].conceptos[conceptoIndex];
      const res = await modalConfirmar(
        'Quitar concepto',
        `¿Quitar <b>${concepto.nombre}</b> ($${concepto.monto.toFixed(2)})?`,
        'Quitar',
        'peligro'
      );
      if (!res.confirmado) return;

      p.personas[personaIndex].conceptos.splice(conceptoIndex, 1);
      guardar();
      invalidarResultado();
      renderizar();
      lanzarAnimacion('eliminar');
    }

    // ===== EDITAR CONCEPTO (nombre) INLINE =====
    function editarNombreConcepto(personaIndex, conceptoIndex, elemento) {
      const p = getProyectoActivo();
      if (!p) return;
      const c = p.personas[personaIndex].conceptos[conceptoIndex];
      if (!c) return;

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'concepto-inline-input';
      input.value = c.nombre;

      const terminar = (guardarCambio) => {
        if (guardarCambio) {
          const nuevoNombre = input.value.trim();
          if (nuevoNombre && nuevoNombre !== c.nombre) {
            c.nombre = nuevoNombre;
            guardar();
            invalidarResultado();
            lanzarAnimacion('editar');
          }
        }
        renderizar();
      };

      input.addEventListener('blur', () => terminar(true));
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); terminar(true); }
        if (e.key === 'Escape') { e.preventDefault(); terminar(false); }
      });

      elemento.replaceWith(input);
      input.focus();
      input.select();
    }

    // ===== EDITAR MONTO INLINE =====
    function editarMontoConcepto(personaIndex, conceptoIndex, elemento) {
      const p = getProyectoActivo();
      if (!p) return;
      const c = p.personas[personaIndex].conceptos[conceptoIndex];
      if (!c) return;

      const input = document.createElement('input');
      input.type = 'text';
      input.inputMode = 'decimal';
      input.className = 'concepto-inline-input monto';
      input.value = String(c.monto);

      // Aplicar filtro numérico en tiempo real
      aplicarFiltroMontoInput(input);

      const terminar = (guardarCambio) => {
        if (guardarCambio) {
          const nuevoMonto = parseFloat(input.value);
          if (!isNaN(nuevoMonto) && nuevoMonto >= 0 && nuevoMonto !== c.monto) {
            c.monto = nuevoMonto;
            guardar();
            invalidarResultado();
            lanzarAnimacion('editar');
          } else if (isNaN(nuevoMonto) || nuevoMonto < 0) {
            // monto inválido: no guardar
          }
        }
        renderizar();
      };

      input.addEventListener('blur', () => terminar(true));
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); terminar(true); }
        if (e.key === 'Escape') { e.preventDefault(); terminar(false); }
      });

      elemento.replaceWith(input);
      input.focus();
      input.select();
    }

    function subtotalPersona(persona) {
      return persona.conceptos.reduce((acc, c) => acc + c.monto, 0);
    }

    function renderizar() {
      const wrapper = document.getElementById('listaWrapper');
      const p = getProyectoActivo();
      if (!p) return;

      if (p.personas.length === 0) {
        wrapper.innerHTML = '<div class="empty-proyectos" style="padding:24px 16px;"><span class="emoji">👥</span>Aún no hay personas en este proyecto.<br>Agrega una para comenzar.</div>';
        return;
      }

      wrapper.innerHTML = '';
      const colores = ['c0', 'c1', 'c2', 'c3', 'c4'];

      p.personas.forEach((persona, i) => {
        const colorClass = colores[i % colores.length];
        const inicial = persona.nombre.charAt(0).toUpperCase();
        const subtotal = subtotalPersona(persona);
        const sinConceptos = persona.conceptos.length === 0;

        const card = document.createElement('div');
        card.className = 'persona-card';

        const header = document.createElement('div');
        header.className = 'persona-header';
        header.innerHTML = `
          <div class="persona-info">
            <div class="avatar ${colorClass}">${inicial}</div>
            <span class="persona-nombre">${persona.nombre}</span>
          </div>
          <span class="persona-subtotal">$${subtotal.toFixed(2)}</span>
          <button class="btn-eliminar" title="Eliminar persona">✕</button>
        `;
        header.querySelector('.btn-eliminar').addEventListener('click', () => eliminarPersona(i));
        card.appendChild(header);

        const conceptosLista = document.createElement('div');
        conceptosLista.className = 'conceptos-lista';

        if (sinConceptos) {
          conceptosLista.innerHTML = '<div class="concepto-empty">Sin conceptos · aportación $0.00</div>';
        } else {
          persona.conceptos.forEach((c, j) => {
            const item = document.createElement('div');
            item.className = 'concepto-item';
            item.innerHTML = `
              <span class="concepto-nombre" title="Doble clic para editar">${c.nombre}</span>
              <span>
                <span class="concepto-monto" title="Doble clic para editar">$${c.monto.toFixed(2)}</span>
                <button class="btn-quitar-concepto" title="Quitar concepto">✕</button>
              </span>
            `;

            // Doble clic / doble tap en NOMBRE
            const nombreSpan = item.querySelector('.concepto-nombre');
            nombreSpan.addEventListener('dblclick', (e) => {
              e.stopPropagation();
              editarNombreConcepto(i, j, nombreSpan);
            });
            let lastTapNombre = 0;
            nombreSpan.addEventListener('touchend', (e) => {
              const now = Date.now();
              if (now - lastTapNombre < 300) {
                e.preventDefault();
                e.stopPropagation();
                editarNombreConcepto(i, j, nombreSpan);
              }
              lastTapNombre = now;
            });

            // Doble clic / doble tap en MONTO
            const montoSpan = item.querySelector('.concepto-monto');
            montoSpan.addEventListener('dblclick', (e) => {
              e.stopPropagation();
              editarMontoConcepto(i, j, montoSpan);
            });
            let lastTapMonto = 0;
            montoSpan.addEventListener('touchend', (e) => {
              const now = Date.now();
              if (now - lastTapMonto < 300) {
                e.preventDefault();
                e.stopPropagation();
                editarMontoConcepto(i, j, montoSpan);
              }
              lastTapMonto = now;
            });

            item.querySelector('.btn-quitar-concepto').addEventListener('click', () => quitarConcepto(i, j));
            conceptosLista.appendChild(item);
          });
        }
        card.appendChild(conceptosLista);

        const inputRow = document.createElement('div');
        inputRow.className = 'concepto-input-row';
        inputRow.innerHTML = `
          <input type="text" class="concepto-nombre-input" placeholder="Concepto (ej: agua)">
          <input type="text" class="concepto-monto-input" placeholder="Monto" inputmode="decimal">
          <button class="btn-add-concepto">+ Añadir</button>
        `;
        card.appendChild(inputRow);

        const btnAdd = inputRow.querySelector('.btn-add-concepto');
        const nombreInp = inputRow.querySelector('.concepto-nombre-input');
        const montoInp = inputRow.querySelector('.concepto-monto-input');

        // Aplicar filtro numérico al input de monto
        aplicarFiltroMontoInput(montoInp);

        btnAdd.addEventListener('click', async () => {
          const ok = await agregarConcepto(i, nombreInp.value, montoInp.value);
          if (ok) {
            const nuevaFila = document.querySelectorAll('.concepto-input-row')[i];
            if (nuevaFila) nuevaFila.querySelector('.concepto-nombre-input').focus();
          }
        });

        [nombreInp, montoInp].forEach(inp => {
          inp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') btnAdd.click();
          });
        });

        wrapper.appendChild(card);
      });
    }

    async function calcular() {
      const p = getProyectoActivo();
      if (!p) return;

      if (p.personas.length < 2) {
        await modalAlerta('Faltan personas', 'Agrega al menos dos personas para calcular.', 'warning');
        lanzarAnimacion('error');
        return;
      }

      const total = p.personas.reduce((acc, x) => acc + subtotalPersona(x), 0);
      const promedio = total / p.personas.length;
      let deudores = [], acreedores = [];

      p.personas.forEach(x => {
        const subtotal = subtotalPersona(x);
        const diff = +(subtotal - promedio).toFixed(2);
        if (diff < 0) deudores.push({ nombre: x.nombre, deuda: -diff });
        else if (diff > 0) acreedores.push({ nombre: x.nombre, deuda: diff });
      });

      let movimientos = [];
      deudores.forEach(d => {
        acreedores.forEach(a => {
          if (d.deuda > 0 && a.deuda > 0) {
            const pago = Math.min(d.deuda, a.deuda);
            movimientos.push({ de: d.nombre, a: a.nombre, monto: pago });
            d.deuda -= pago;
            a.deuda -= pago;
          }
        });
      });

      let desgloseHTML = '<b>Desglose por persona:</b><br>';
      p.personas.forEach(x => {
        const subtotal = subtotalPersona(x);
        const sinCon = x.conceptos.length === 0;
        const conceptosStr = sinCon
          ? '<i>sin conceptos</i>'
          : x.conceptos.map(c => `${c.nombre} $${c.monto.toFixed(2)}`).join(', ');
        desgloseHTML += `<div class="pago-item"><b>${x.nombre}:</b> $${subtotal.toFixed(2)} <span style="color:var(--texto-suave);font-weight:600;">(${conceptosStr})</span></div>`;
      });

      const resultadoDiv = document.getElementById('resultado');
      resultadoDiv.innerHTML =
        `<b>Proyecto:</b> ${p.nombre}<br>` +
        `<b>Total general:</b> $${total.toFixed(2)}<br>` +
        `<b>Promedio por persona:</b> $${promedio.toFixed(2)}<br><br>` +
        desgloseHTML +
        `<br><b>Ajustes:</b><br>` +
        (movimientos.length
          ? movimientos.map(m => `<div class="pago-item">${m.de} le paga $${m.monto.toFixed(2)} a ${m.a}</div>`).join('')
          : 'Todos están parejos.');

      hayResultado = true;
      actualizarBotonAccion();
      lanzarAnimacion('calcular');
    }

    async function intentarEnviarWhatsApp() {
      const texto = document.getElementById('resultado').innerText.trim();
      if (!texto) {
        await modalAlerta('Sin resultados', 'Primero calcula los ajustes antes de enviar.', 'warning');
        lanzarAnimacion('error');
        return;
      }
      lanzarAnimacion('whatsapp');
      setTimeout(() => {
        const url = `https://wa.me/?text=${encodeURIComponent(texto)}`;
        window.open(url, '_blank');
      }, 500);
    }

    document.getElementById('nombre').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') intentarAgregarPersona();
    });

    document.getElementById('proyectoTitulo').addEventListener('dblclick', () => {
      const p = getProyectoActivo();
      if (!p) return;
      const span = document.getElementById('proyectoTitulo');
      editarNombreProyecto(p.id, span);
    });

    // ===== INIT =====
    cargar();
    renderizarTabs();
    renderizarVista();
  </script>
</body>
